name: Build StopWake APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare Project Files
        run: |
          if [ -f "StopWake-Android-Project.zip" ]; then
            unzip -o StopWake-Android-Project.zip
          fi
          if [ -d "StopWake-Android-Project" ]; then
            cp -r StopWake-Android-Project/* .
          fi
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: StopWake-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
